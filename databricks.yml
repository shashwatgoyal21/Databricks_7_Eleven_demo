bundle:
  name: nbo-demo

variables:
  catalog:
    description: Unity Catalog catalog for the demo tables
    default: workspace
  schema:
    description: Schema for the demo tables (keep in sync with NBO_SCHEMA in app/app.yaml)
    default: nbo_demo
  members:
    description: Number of synthetic loyalty shoppers to simulate
    default: "25000"
  warehouse_id:
    description: Pro or Serverless SQL warehouse the app queries
    default: bb3aef1c44eb3c3a
  endpoint_name:
    description: Model Serving endpoint that makes the real-time decision
    default: nbo-decision

resources:
  jobs:
    nbo_demo_build:
      name: nbo-demo-build
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ./src/01_generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              members: ${var.members}
        - task_key: train_and_score
          depends_on:
            - task_key: generate_data
          notebook_task:
            notebook_path: ./src/02_train_and_score.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: validate_story
          depends_on:
            - task_key: train_and_score
          notebook_task:
            notebook_path: ./src/03_validate_story.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: stream_decisions
          depends_on:
            - task_key: validate_story
          notebook_task:
            notebook_path: ./src/05_stream_decisions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: serve_decisions
          depends_on:
            - task_key: stream_decisions
          notebook_task:
            notebook_path: ./src/06_serve_decisions.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              endpoint_name: ${var.endpoint_name}
        - task_key: governance
          depends_on:
            - task_key: serve_decisions
          notebook_task:
            notebook_path: ./src/04_governance.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: offer_ledger
          depends_on:
            - task_key: governance
          notebook_task:
            notebook_path: ./src/07_offer_ledger.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              endpoint_name: ${var.endpoint_name}
              app_name: nbo-decision-engine
        - task_key: agent
          depends_on:
            - task_key: offer_ledger
          notebook_task:
            notebook_path: ./src/08_agent.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
              app_name: nbo-decision-engine
              genie_space_id: ""

  apps:
    nbo_app:
      name: nbo-decision-engine
      description: Real-time in-store Next Best Offer decisioning on synthetic data
      source_code_path: ./app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-658a2a7c-0afe.cloud.databricks.com
