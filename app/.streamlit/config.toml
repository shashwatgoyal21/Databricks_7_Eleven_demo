# Databricks brand system, dark: Ink / Navy base, Lava accent only, Green and Amber for status, DM Sans and DM Mono.
[theme]
base = "dark"
primaryColor = "#FF3621"
backgroundColor = "#0B2026"
secondaryBackgroundColor = "#11262D"
textColor = "#F9F7F4"
linkColor = "#FF5F46"
borderColor = "#1F3A43"
showWidgetBorder = true
baseRadius = "10px"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
codeFont = "DM Mono:https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 700, 600, 600, 500, 500]
greenColor = "#00A972"
orangeColor = "#FEAB03"
redColor = "#FF5F46"
blueColor = "#618693"
violetColor = "#618693"
grayColor = "#9AA9AE"
chartCategoricalColors = ["#FF3621", "#00A972", "#FEAB03", "#618693", "#F9F7F4", "#1B5162"]
