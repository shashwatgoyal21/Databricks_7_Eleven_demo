command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: NBO_SCHEMA
    value: workspace.nbo_demo
  - name: NBO_ENDPOINT
    value: nbo-decision
  - name: NBO_BRAND
    value: "7-Eleven"
  # Genie space behind Ask Genie (the build job also writes it to agent_config).
  - name: GENIE_SPACE_ID
    value: "01f1e5308ffc1e808a8898c1613b1654"
  # Push delivery through the retailer's existing stack (see README, "Push delivery").
  # Demo: NBO_PUSH_PROVIDER=ntfy, NBO_PUSH_URL=https://ntfy.sh/<your topic>
  - name: NBO_PUSH_PROVIDER
    value: ""
  - name: NBO_PUSH_URL
    value: ""
  # - name: NBO_PUSH_API_KEY
  #   valueFrom: push-api-key        # secret resource for Braze / Airship / OneSignal
