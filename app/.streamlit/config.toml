# Databricks brand system. Light by default (Oat background, white cards, Ink text); the app's Dark mode
# toggle switches to neutral black. Lava is the only accent; Green and Amber for status. DM Sans and DM Mono.
[theme]
base = "light"
primaryColor = "#FF3621"
backgroundColor = "#F9F7F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B2026"
linkColor = "#E02E1A"
borderColor = "#DBD7CE"
showWidgetBorder = true
baseRadius = "10px"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
codeFont = "DM Mono:https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 700, 600, 600, 500, 500]
greenColor = "#00A972"
orangeColor = "#FEAB03"
redColor = "#E02E1A"
blueColor = "#618693"
violetColor = "#618693"
grayColor = "#5F6F75"
chartCategoricalColors = ["#FF3621", "#00A972", "#FEAB03", "#618693", "#1B3139", "#1B5162"]
